spring.application.name=ebank-service
server.port=8057

spring.datasource.url=jdbc:h2:mem:accounts-db
spring.h2.console.enabled=true

spring.cloud.config.enabled=false

# Temporaire, jusqu'a l'etape 4 (Eureka) : client Eureka coupe et adresse
# de CUSTOMER-SERVICE donnee en dur au LoadBalancer utilise par OpenFeign.
# A l'etape 4, on supprime ces deux lignes et Eureka prend le relais.
eureka.client.enabled=false
spring.cloud.discovery.client.simple.instances.CUSTOMER-SERVICE[0].uri=http://localhost:8056

management.endpoints.web.exposure.include=*
